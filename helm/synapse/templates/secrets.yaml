apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synapse.fullname" . }}-secrets
  labels:
    {{- include "synapse.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.llm.apiKeySecretKey }}
  LLM_API_KEY: {{ .Values.llm.apiKeySecretKey | quote }}
  {{- end }}
  {{- if .Values.database.password }}
  DATABASE_PASSWORD: {{ .Values.database.password | quote }}
  {{- end }}
