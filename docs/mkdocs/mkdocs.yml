site_name: Synapse Documentation
site_description: Distributed Cognitive Agent Platform
site_url: https://synapse.github.io/synapse
repo_url: https://github.com/synapse/synapse
repo_name: synapse/synapse
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [../../synapse]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
  - autorefs
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home:
    - Introduction: index.md
    - Quick Start: ../QUICKSTART.md
    - Installation: ../INSTALLATION_GUIDE.md
  - Architecture:
    - Overview: ../architecture_overview.md
    - Cognitive Cycle: ../cognitive_cycle.md
    - Security Model: ../security_model.md
    - Distributed Execution: ../distributed_execution_model.md
  - API Reference:
    - Agents: api/agents.md
    - Skills: api/skills.md
    - Memory: api/memory.md
    - Security: api/security.md
  - Deployment:
    - Docker: ../docker/README.md
    - Kubernetes: deployment/kubernetes.md
    - Helm: deployment/helm.md
  - Monitoring:
    - Metrics: monitoring/metrics.md
    - Tracing: monitoring/tracing.md
    - Grafana: monitoring/grafana.md
  - Development:
    - Contributing: ../CONTRIBUTING.md
    - Testing: development/testing.md
    - Code Style: development/style.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/synapse/synapse
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/synapse-agent/
  version:
    provider: mike

copyright: Copyright &copy; 2024-2026 Synapse Project
