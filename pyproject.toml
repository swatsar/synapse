[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-agent"
version = "3.4.1"
description = "Universal Autonomous Agent Platform - Distributed Cognitive Platform for Autonomous Agents"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Евгений Савченко", email = "evgeniisav@gmail.com" },
]
keywords = [
    "ai",
    "agent",
    "automation",
    "llm",
    "autonomous",
    "cognitive",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.8.0,<3.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.30,<3.0",
    "litellm>=1.40.0,<2.0",
    "fastapi>=0.115.0,<1.0",
    "uvicorn>=0.30.0,<1.0",
    "aiosqlite>=0.20.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "pyyaml>=6.0.0,<7.0",
    "python-dotenv>=1.0.0,<2.0",
    "python-dateutil>=2.9.0,<3.0",
    "chromadb>=0.5.0,<1.0",
    "asyncpg>=0.29.0,<1.0",
    "redis>=5.0.0,<6.0",
    "aiogram>=3.0.0,<4.0",
    "playwright>=1.40.0,<2.0",
    "prometheus-client>=0.20.0,<1.0",
    "structlog>=24.0.0,<25.0",
    "opentelemetry-api>=1.25.0,<2.0",
    "opentelemetry-sdk>=1.25.0,<2.0",
    "opentelemetry-exporter-otlp>=1.25.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "typer>=0.12.0,<1.0",
    "rich>=13.0.0,<14.0",
]

[project.license]
text = "MIT"

[project.optional-dependencies]
gui = [
    "pywebview>=5.0,<6.0",
]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-cov>=5.0.0,<6.0",
    "pytest-xdist>=3.5.0,<4.0",
    "coverage[toml]>=7.5.0,<8.0",
    "freezegun>=1.5.0,<2.0",
    "moto>=5.0.0,<6.0",
    "mypy>=1.10.0,<2.0",
    "ruff>=0.5.0,<1.0",
    "pre-commit>=3.7.0,<4.0",
    "bandit[toml]>=1.7.0,<2.0",
    "safety>=3.0.0,<4.0",
    "semgrep>=1.80.0,<2.0",
    "types-python-dateutil>=2.9.0",
    "types-PyYAML>=6.0.0",
    "types-redis>=4.6.0",
]
docs = [
    "mkdocs>=1.6.0,<2.0",
    "mkdocs-material>=9.5.0,<10.0",
    "mkdocstrings[python]>=0.25.0,<1.0",
    "mkdocs-gen-files>=0.5.0,<1.0",
    "mkdocs-literate-nav>=0.6.0,<1.0",
    "mkdocs-section-index>=0.3.0,<1.0",
]
observability = [
    "opentelemetry-instrumentation-redis>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "prometheus-fastapi-instrumentator>=6.1.0,<7.0",
]
performance = [
    "locust>=2.30.0,<3.0",
    "aiocache>=0.12.0,<1.0",
]
full = [
    "synapse-agent[gui,dev,docs,observability,performance]",
]

[project.scripts]
synapse = "synapse.main:main"

[project.urls]
Homepage = "https://github.com/synapse/synapse"
Documentation = "https://synapse.readthedocs.io"
Repository = "https://github.com/synapse/synapse"
Issues = "https://github.com/synapse/synapse/issues"

[tool.setuptools.package-data]
synapse = [
    "py.typed",
    "*.yaml",
    "*.json",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "synapse*",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = [
    "tests/",
    "benchmarks/",
    "skills/",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise without from inside except
    "ARG002", # unused method argument
    "ARG005", # unused lambda argument
]

[tool.ruff.per-file-ignores]
"synapse/tests/*" = ["ARG", "PTH"]
"tests/*" = ["ARG", "PTH"]

[tool.ruff.isort]
known-first-party = ["synapse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "phase1: Core Skeleton",
    "phase2: Execution and Security",
    "phase3: Perception and Memory",
    "phase4: Self-Evolution",
    "phase5: Reliability and Observability",
    "phase6: Deployment and UI",
    "phase6_1: Phase 6.1 - Multi-tenant",
    "phase7: Phase 7 - Distributed Orchestration",
    "phase7_1: Phase 7.1",
    "phase7_2: Phase 7.2",
    "phase8: Phase 8 - Zero Trust",
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "performance: Performance tests",
    "slow: Slow running tests",
    "api: API tests",
    "chaos: Chaos engineering tests",
    "compliance: Compliance tests",
    "gui: GUI tests",
    "tdd: TDD tests",
    "benchmark: Benchmark tests",
    "workload: Workload tests",
    "system: System tests",
]
addopts = "-v --tb=short"
testpaths = [
    "tests",
]

[tool.black]
line-length = 100
target-version = [
    "py311",
    "py312",
]

[tool.coverage.run]
source = [
    "synapse",
]
omit = [
    "synapse/tests/*",
    "tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "TYPE_CHECKING",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
]
